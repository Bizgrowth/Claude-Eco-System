name: Refresh dashboard data
on:
  schedule: [{ cron: "*/20 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: GH_READ_TOKEN  # the GitHub environment that holds the GH_READ_TOKEN secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-github.mjs
        env:
          # Add a repo secret GH_READ_TOKEN (fine-grained PAT, read-only) to include other/private repos.
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "dashboard-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/github.json
          git diff --cached --quiet || (git commit -m "chore: refresh dashboard data" && git push)
